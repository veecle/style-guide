inputs:
  anthropic_api_key:
    description: Anthropic API key for Claude
    required: true
  show_full_output:
    description: Enable the option of the same name from claude-code-action (and summary)
    required: false
    default: false

runs:
  using: composite

  steps:
    - uses: anthropics/claude-code-action@v1
      env:
        # Force subagents to run in the foreground so the main agent blocks on
        # their results instead of exiting while they run in the background.
        # See https://github.com/anthropics/claude-code-action/issues/1462
        CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
      with:
        anthropic_api_key: ${{ inputs.anthropic_api_key }}

        display_report: ${{ inputs.show_full_output }}
        show_full_output: ${{ inputs.show_full_output }}

        additional_permissions: |
          actions: read

        claude_args: |
          --model fable
          --add-dir "${{ github.action_path }}/../../.."
          --append-system-prompt "
            Read @${{ github.action_path }}/../../../.agents/rules/shared/AGENTS.md for organizational guidelines.
          "
