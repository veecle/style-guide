inputs:
  anthropic_federation_rule_id:
    description: Anthropic workload identity federation rule ID (`fdrl_...`)
    required: false
    default: ""
  anthropic_organization_id:
    description: Anthropic organization ID used for workload identity federation
    required: false
    default: ""
  anthropic_service_account_id:
    description: Anthropic service account ID (`svac_...`) used for workload identity federation
    required: false
    default: ""
  anthropic_api_key:
    description: >-
      Deprecated: Anthropic API key for Claude, use the workload identity federation inputs instead.
      Takes precedence over federation when set.
    required: false
    default: ""
  show_full_output:
    description: Enable the option of the same name from claude-code-action (and summary)
    required: false
    default: false
  allowed_bots:
    description: Comma-separated list, forwarded to the option of the same name from claude-code-action
    required: false
    default: ""

runs:
  using: composite

  steps:
    - shell: bash
      id: checkout-pr
      run: |
        gh pr checkout ${{ github.event.pull_request.number || github.event.issue.number }}

        # Extract just the file path from the workflow ref (format: owner/repo/.github/workflows/file.yml@ref).
        workflow_file_path="$(
          echo "${{ github.workflow_ref }}" | sed -E 's|.*/.github/workflows/([^@]*).*|.github/workflows/\1|'
        )"

        if gh pr diff --name-only | grep -F "$workflow_file_path"; then
          echo "workflow-changed=true" >> $GITHUB_OUTPUT
          echo "::notice::Current workflow file ($workflow_file_path) changed - skipping review"
        else
          echo "workflow-changed=false" >> $GITHUB_OUTPUT
          echo "style-guide-base=$(realpath ${{ github.action_path }}/../../..)" >> $GITHUB_OUTPUT
        fi
      env:
        GH_TOKEN: ${{ github.token }}

    - shell: bash
      run: mkdir -p "${{ runner.temp }}/claude-tmp"

    # Only repositories linking their documentation with lynk (see `lynk` in the style guide's `flake.nix`) get it.
    # The excluded paths only describe the syntax, they would otherwise match when reviewing the style guide itself.
    - shell: bash
      id: detect-lynk
      if: steps.checkout-pr.outputs.workflow-changed != 'true'
      run: |
        if git ls-files ':(glob)**/.lynkignore' | grep -q . \
          || git grep -qE '\]\(lynk:|\]: lynk:|<!-- lynk ' -- ':!.github/actions/claude-review' ':!.agents/rules/shared'
        then
          echo "uses-lynk=true" >> $GITHUB_OUTPUT
        else
          echo "uses-lynk=false" >> $GITHUB_OUTPUT
        fi

    # Failing to provide lynk degrades to a review without it instead of failing the review: the prompt only mentions
    # lynk when `build-lynk` succeeded.
    - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877  # v32.1.0
      if: steps.detect-lynk.outputs.uses-lynk == 'true'
      continue-on-error: true
      with:
        # Binary cache populated by lynk's CI, see `lynk` in the style guide's `flake.nix`.
        extra_nix_config: |
          extra-substituters = https://lynk.cachix.org
          extra-trusted-public-keys = lynk.cachix.org-1:V3B7U9dBI5tqI+ort0xxOpa7kfxQK+g1t3r7VxYLrh8=

    # Built from the style guide's own flake and lock, never from the PR checkout: the reviewed branch must not be
    # able to choose what runs alongside the OIDC token.
    - shell: bash
      id: build-lynk
      if: steps.detect-lynk.outputs.uses-lynk == 'true'
      continue-on-error: true
      working-directory: ${{ runner.temp }}
      run: |
        nix build "path:${{ steps.checkout-pr.outputs.style-guide-base }}#lynk" --out-link "${{ runner.temp }}/lynk"
        echo "${{ runner.temp }}/lynk/bin" >> $GITHUB_PATH

    - uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67  # v1.0.286
      env:
        # Force subagents to run in the foreground so the main agent blocks on
        # their results instead of exiting while they run in the background.
        # See https://github.com/anthropics/claude-code-action/issues/1462
        CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        GH_API_COMMENTS_COMMAND: >-
          ${{ github.action_path }}/gh-pr-comments.sh
          ${{ github.event.pull_request.number || github.event.issue.number }}
      # `claude-code-action` fails if the workflow file changes.
      if: steps.checkout-pr.outputs.workflow-changed != 'true'
      with:
        anthropic_federation_rule_id: ${{ inputs.anthropic_federation_rule_id }}
        anthropic_organization_id: ${{ inputs.anthropic_organization_id }}
        anthropic_service_account_id: ${{ inputs.anthropic_service_account_id }}
        anthropic_api_key: ${{ inputs.anthropic_api_key }}

        display_report: ${{ inputs.show_full_output }}
        show_full_output: ${{ inputs.show_full_output }}

        allowed_bots: ${{ inputs.allowed_bots }}

        additional_permissions: |
          actions: read

        prompt: |
          REPO: ${{ github.repository }}
          PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

          Please conduct a thorough code review of this pull request.
          Make sure to follow the guidelines in
          @${{ steps.checkout-pr.outputs.style-guide-base  }}/.agents/rules/shared/code-review.md

          Note: The PR branch is already checked out in the current working directory.

          IMPORTANT: Before starting your review, read the details including reviews and inline comments
          (use exactly these commands, do not substitute variables):
          ```
          gh pr view --json title,body,files,additions,deletions,comments
          ${{ env.GH_API_COMMENTS_COMMAND }}
          ```

          Check for any issues that have already been identified by previous reviews.
          Only comment on new issues that haven't been previously noted.

          ${{
            github.event.comment
            && format('
              User provided additional context for this review:
              ```
              {0}
              ```
            ', github.event.comment.body)
            || ''
          }}

          Apply your standard review process, covering all relevant areas including code quality, documentation
          accuracy, content quality, and structural organization according to your established review priorities.

          Use `${{ runner.temp }}/claude-tmp` to store temporary files
          `dep-diff.sh` is at `${{ github.action_path }}/dep-diff.sh`

          IMPORTANT: The only `Bash` commands you are allowed to run are the ones explicitly mentioned
          in this prompt:
          ```
          gh pr comment ...
          gh pr diff ...
          gh pr view ...
          ${{ env.GH_API_COMMENTS_COMMAND }}
          ${{ github.action_path }}/dep-diff.sh ...
          git describe ...
          git diff ...
          git log ...
          git tag --list ...
          ```

          ${{
            steps.build-lynk.outcome == 'success'
            && '
              This repository links its documentation to the code with `lynk`, so you may also run:
              ```
              lynk resolve ...
              lynk backlinks ...
              gh pr diff | lynk affected
              lynk context ...
              ```
            '
            || ''
          }}
          Commands not listed above (including other `git` subcommands, `cat`, `ls`, `grep`, `find`, pipes into other
          tools than the ones listed, etc.) are not allowlisted: read-only commands may still run sandboxed, but
          others will be denied.
          Prefer `Read`, `Write` and the MCP tools where possible, and never try to work around a denied command.

          To send top-level comments write them to a temporary file first,
          then use `gh pr comment --body-file the-temp-file.txt` (avoids shell backtick/quote escaping issues).
          Use `mcp__github_inline_comment__create_inline_comment` to highlight specific areas of concern.
          Only your GitHub comments that you post will be seen,
          so don't submit your review as a normal message, just as comments.
          If all issues have been addressed or already noted,
          post a brief note like "✅ Review complete - no new issues found".

        # Pin the permission mode: since v1.0.273 `claude-code-action` defaults to `auto` unless e.g.
        # `allowed_bots` is set, which would let tools outside `--allowedTools` run for some callers.
        # The `lynk` entries are always present but harmless when `lynk` is not on `PATH`; lynk rejects `--root` after
        # the subcommand, so they cannot point it outside the checkout.
        claude_args: |
          --permission-mode default
          --model fable
          --add-dir "${{ steps.checkout-pr.outputs.style-guide-base }}"
          --add-dir "${{ runner.temp }}/claude-tmp"
          --append-system-prompt "
            Read @${{ steps.checkout-pr.outputs.style-guide-base }}/.agents/rules/shared/AGENTS.md
            for organizational guidelines.
          "
          --allowedTools "
            mcp__github_ci__get_ci_status,
            mcp__github_ci__get_workflow_run_details,
            mcp__github_ci__download_job_log,
            mcp__github_inline_comment__create_inline_comment,
            Bash(gh pr comment:*),
            Bash(gh pr diff:*),
            Bash(gh pr view:*),
            Bash(${{ env.GH_API_COMMENTS_COMMAND }}),
            Bash(${{ github.action_path }}/dep-diff.sh:*),
            Bash(git describe:*),
            Bash(git diff:*),
            Bash(git log:*),
            Bash(git tag --list:*),
            Bash(lynk resolve:*),
            Bash(lynk backlinks:*),
            Bash(lynk affected:*),
            Bash(lynk context:*),
            Write,
          "

        settings: |
          {
            "env": {
              "MAX_THINKING_TOKENS": "4000"
            }
          }
